document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"23dad65a-c2dc-4c6c-980e-ebb926c4f24d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<meta name=\"theme-color\" content=\"#E4ECFF\">\n<style>/* ==========================================================================\n   Gibson Dunn — Colors & Typography Foundation\n   --------------------------------------------------------------------------\n   Source of truth for the brand: extracted from the firm's PowerPoint and\n   Word brand guidelines (January 2026) and the Master templates (April 2026).\n\n   The system is austere on purpose: a single typeface (Arial), one accent\n   color (Gibson Dunn blue #2E69FF), and a black/white/gray neutral scale.\n   Accent colors (red, orange, yellow, green, purple) MUST NOT be used as\n   design elements; they're only allowed when strictly required to explain\n   data in an infographic.\n   ========================================================================== */\n\n:root {\n  /* ----- Brand primaries ------------------------------------------------ */\n  --gd-black:    #000000;   /* Primary text, lines, wordmark */\n  --gd-white:    #FFFFFF;   /* Reverse text on dark backgrounds */\n  --gd-blue:     #2E69FF;   /* The Gibson Dunn blue. Emphasis only. */\n\n  /* ----- Brand neutrals (secondary) ------------------------------------- */\n  --gd-gray-600: #666666;   /* Secondary body text, captions */\n  --gd-gray-400: #CCCCCC;   /* Borders, dividers (note: guidelines list \"CCCCC\" — interpreted) */\n  --gd-gray-300: #D9D9D9;   /* Table row banding, soft fills */\n  --gd-gray-100: #F2F2F2;   /* Page tint, callout backgrounds */\n\n  /* ----- Semantic foreground ------------------------------------------- */\n  --fg-1:        var(--gd-black);     /* Primary text */\n  --fg-2:        var(--gd-gray-600);  /* Secondary text */\n  --fg-3:        var(--gd-gray-400);  /* Tertiary / disabled */\n  --fg-accent:   var(--gd-blue);      /* Emphasis only — sparingly */\n  --fg-inverse:  var(--gd-white);\n\n  /* ----- Semantic backgrounds ------------------------------------------ */\n  --bg-page:     var(--gd-white);\n  --bg-tint:     var(--gd-gray-100);\n  --bg-band:     var(--gd-gray-300);\n  --bg-rule:     var(--gd-gray-400);\n  --bg-dark:     var(--gd-black);\n  --bg-accent:   var(--gd-blue);\n\n  /* ----- Lines (vertical only — horizontal lines are forbidden) -------- */\n  --rule-color:  var(--gd-black);\n  --rule-color-on-dark: var(--gd-white);\n  --rule-weight: 1.5px;     /* Thin, always vertical */\n\n  /* ----- Type family ---------------------------------------------------\n     The brand font is Arial. Two weights only — Regular (400) and Bold\n     (700). No italics, no alternates, no display faces. Arial ships\n     natively on Windows / macOS / iOS / Android, so no webfont is bundled.\n     The single \"sans-serif\" generic is the only fallback — kept as a\n     safety net for headless renderers where Arial is absent.\n     If you need a true Arial WOFF (e.g. for a Linux PDF render or PPTX\n     export), drop the file at `assets/fonts/arial.woff2` and add an\n     `@font-face` block below. See README \"Fonts\" section. */\n  --font-arial: Arial, sans-serif;\n  --font-sans:  var(--font-arial);\n  --font-mono:  ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* ----- Type scale (px @ 1920×1080 slide canvas)\n     Mapped 1:1 from the PowerPoint guidelines size & spacing chart.\n     line-height stored as multipliers derived from the source chart. */\n  --fs-display:    80px;  --lh-display:   75px;   /* Cover headings */\n  --fs-h1:         45px;  --lh-h1:        45px;   /* Section dividers */\n  --fs-h2:         30px;  --lh-h2:        31px;   /* Slide title */\n  --fs-h3:         20px;  --lh-h3:        22px;   /* Subhead */\n  --fs-lead:       17px;  --lh-lead:      19px;   /* Lede / large body */\n  --fs-body:       15px;  --lh-body:      18px;   /* Standard body */\n  --fs-body-sm:    14px;  --lh-body-sm:   17px;\n  --fs-caption:    13px;  --lh-caption:   16px;   /* Captions, footnotes */\n  --fs-micro:      12px;  --lh-micro:     15px;   /* Footers, sources */\n  --fs-mini:      10.5px; --lh-mini:    13.5px;   /* Disclaimer / legal */\n\n  /* ----- Letter-spacing tokens\n     Brand uses condensed character spacing across the scale. PowerPoint\n     \"0.5 condensed\" ≈ -0.5pt = -0.025em; \"0.3 condensed\" ≈ -0.015em. */\n  --ls-condensed-strong: -0.025em;  /* fs-display through fs-body-sm */\n  --ls-condensed-soft:   -0.015em;  /* fs-caption and below */\n  --ls-tracked:           0.04em;   /* All-caps headers (cover/dividers) */\n\n  /* ----- Weight tokens (Arial has Regular and Bold only) --------------- */\n  --fw-regular: 400;   /* @kind font */\n  --fw-bold:    700;   /* @kind font */\n\n  /* ----- Spacing scale (slide-friendly, in px) ------------------------- */\n  --sp-1:   4px;\n  --sp-2:   8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  24px;\n  --sp-6:  32px;\n  --sp-7:  48px;\n  --sp-8:  64px;\n  --sp-9:  96px;\n  --sp-10: 128px;\n\n  /* ----- Indent scale (Word/PPT bullets, from guidelines) -------------- */\n  --indent-1: 0.22in; /* @kind spacing */ /* fs 21–25 first level */\n  --indent-2: 0.19in; /* @kind spacing */ /* fs 13–20 first level */\n  --indent-3: 0.13in; /* @kind spacing */ /* fs  8–12 first level */\n\n  /* ----- Radii ---------------------------------------------------------\n     The brand is square. Cards, callouts, and image masks are crisp 0px.\n     A small 2px is allowed only on UI affordances like form fields. */\n  --radius-0: 0;\n  --radius-1: 2px;\n\n  /* ----- Elevation ----------------------------------------------------\n     The brand has no shadow system. Hierarchy is conveyed with color blocks\n     (full-bleed black or blue panels) and vertical rules. We ship a single\n     subtle shadow for screen UI affordances only. */\n  --shadow-ui: 0 1px 2px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);\n}\n\n/* ==========================================================================\n   Base element styles\n   ========================================================================== */\n\nhtml {\n  font-family: var(--font-sans);\n  color: var(--fg-1);\n  background: var(--bg-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  font-size: var(--fs-body);\n  line-height: calc(var(--lh-body) / var(--fs-body));\n  letter-spacing: var(--ls-condensed-strong);\n  font-weight: var(--fw-regular);\n}\n\n/* All copy is left-aligned by default — brand rule. */\np, h1, h2, h3, h4, h5, h6, ul, ol, dl, blockquote {\n  text-align: left;\n  margin: 0;\n}\n\n/* ----- Headings ---------------------------------------------------------- */\n.gd-display,\nh1.gd-display {\n  font: var(--fw-bold) var(--fs-display)/calc(var(--lh-display) / var(--fs-display)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n  text-transform: uppercase;          /* Cover + section dividers only */\n  color: var(--fg-1);\n}\n\nh1, .gd-h1 {\n  font: var(--fw-bold) var(--fs-h1)/calc(var(--lh-h1) / var(--fs-h1)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n  text-transform: uppercase;\n  color: var(--fg-1);\n}\n\nh2, .gd-h2 {\n  font: var(--fw-bold) var(--fs-h2)/calc(var(--lh-h2) / var(--fs-h2)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n  color: var(--fg-1);\n}\n\nh3, .gd-h3 {\n  font: var(--fw-bold) var(--fs-h3)/calc(var(--lh-h3) / var(--fs-h3)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n  color: var(--fg-1);\n}\n\n/* Blue large/small body header — Word styles \"Body Header Large/Small\" */\n.gd-body-header-lg {\n  font: var(--fw-bold) 13px/16px var(--font-sans);\n  letter-spacing: var(--ls-condensed-soft);\n  color: var(--fg-accent);\n  text-transform: uppercase;\n}\n.gd-body-header-sm {\n  font: var(--fw-bold) 11px/14px var(--font-sans);\n  letter-spacing: var(--ls-condensed-soft);\n  color: var(--fg-accent);\n  text-transform: uppercase;\n}\n\n/* ----- Body & utilities -------------------------------------------------- */\np, .gd-body {\n  font: var(--fw-regular) var(--fs-body)/calc(var(--lh-body) / var(--fs-body)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n  color: var(--fg-1);\n}\n\n.gd-lead {\n  font: var(--fw-regular) var(--fs-lead)/calc(var(--lh-lead) / var(--fs-lead)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n}\n\n.gd-caption,\nsmall {\n  font: var(--fw-regular) var(--fs-caption)/calc(var(--lh-caption) / var(--fs-caption)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-soft);\n  color: var(--fg-2);\n}\n\n.gd-micro {\n  font: var(--fw-regular) var(--fs-micro)/calc(var(--lh-micro) / var(--fs-micro)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-soft);\n  color: var(--fg-2);\n}\n\n.gd-mini {\n  font: var(--fw-regular) var(--fs-mini)/calc(var(--lh-mini) / var(--fs-mini)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-soft);\n  color: var(--fg-2);\n}\n\n/* Bold black inline emphasis OR blue regular inline emphasis.\n   Brand explicitly forbids underlining for emphasis. */\nb, strong, .gd-emph {\n  font-weight: var(--fw-bold);\n  color: var(--fg-1);\n}\n.gd-emph-blue {\n  color: var(--fg-accent);\n  font-weight: var(--fw-regular);\n}\nu, .gd-no-underline { text-decoration: none; }\n\n/* ----- Quotes (Arial Bold black, Arial Regular blue source) -------------- */\n.gd-quote {\n  font: var(--fw-bold) 24px/30px var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n  color: var(--fg-1);\n}\n.gd-quote::before { content: \"\\201C\"; }\n.gd-quote::after  { content: \"\\201D\"; }\n.gd-quote-source {\n  margin-top: var(--sp-3);\n  font: var(--fw-regular) var(--fs-body-sm)/calc(var(--lh-body-sm) / var(--fs-body-sm)) var(--font-sans);\n  letter-spacing: var(--ls-condensed-strong);\n  color: var(--fg-accent);\n}\n\n/* ----- Bullets ----------------------------------------------------------\n   Filled round only. Hollow / square / other markers are forbidden. */\nul, .gd-bullets {\n  list-style: none;\n  padding-left: 0;\n}\nul > li, .gd-bullets > li {\n  position: relative;\n  padding-left: var(--indent-2);\n  margin-bottom: var(--sp-1);\n}\nul > li::before, .gd-bullets > li::before {\n  content: \"\";\n  position: absolute;\n  left: 0.05in;\n  top: 0.62em;\n  width: 5px; height: 5px;\n  background: currentColor;\n  border-radius: 50%;\n}\n\n/* ----- Links ------------------------------------------------------------ */\na {\n  color: var(--fg-accent);\n  text-decoration: none;\n  border-bottom: 1px solid currentColor;\n}\na:hover { color: var(--fg-1); }\n\n/* ----- Vertical rules (only allowed orientation) ------------------------ */\n.gd-rule-v {\n  width: var(--rule-weight);\n  background: var(--rule-color);\n  align-self: stretch;\n}\n.gd-rule-v--inverse { background: var(--rule-color-on-dark); }\n\n/* ----- Color blocks (full-bleed dark / blue / tint panels) -------------- */\n.gd-block-dark   { background: var(--bg-dark);    color: var(--fg-inverse); }\n.gd-block-blue   { background: var(--bg-accent);  color: var(--fg-inverse); }\n.gd-block-tint   { background: var(--bg-tint);    color: var(--fg-1); }\n.gd-block-white  { background: var(--bg-page);    color: var(--fg-1); }\n.gd-block-dark .gd-emph,\n.gd-block-blue .gd-emph { color: currentColor; }\n\n/* On dark/blue blocks, switch foreground tokens to white. */\n.gd-block-dark, .gd-block-blue {\n  --fg-1: #FFFFFF;\n  --fg-2: rgba(255,255,255,0.78);\n  --fg-3: rgba(255,255,255,0.55);\n  --fg-accent: #FFFFFF;\n}\n\n/* ----- Selection -------------------------------------------------------- */\n::selection { background: var(--gd-blue); color: var(--gd-white); }\n<\u002Fstyle>\n<script src=\"5010663d-902a-4862-ae37-4dd981fb3219\"><\u002Fscript>\n<script src=\"f23f0617-b518-4715-b388-4b9877feac47\"><\u002Fscript>\n<script src=\"b5ab4eb6-c0bf-43da-a265-dd4b7c54c06a\"><\u002Fscript>\n<style>html,body{margin:0;height:100%;background:#fff;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}a{color:#2E69FF;text-decoration:none;border-bottom:none}a:hover{color:#000}input,select{font-family:Arial,sans-serif;-webkit-appearance:none;appearance:none}@keyframes scanline{0%{top:8%}100%{top:88%}}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:#fff;color:#000;letter-spacing:-0.015em;overflow:hidden\">\n\n<sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#E4ECFF;padding:calc(env(safe-area-inset-top) + 20px) 20px 24px;display:flex;flex-direction:column;gap:20px;flex:none\" data-screen-label=\"Home\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n<div style=\"font:700 11px/14px Arial;text-transform:uppercase;color:#2E69FF\">Pantry · {{ todayLabel }}<\u002Fdiv>\n<div style=\"display:flex;gap:16px;font:400 13px/16px Arial\">\n<div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;padding:6px 0\">{{ homeLabel }}<\u002Fdiv>\n<div sc-camel-on-click=\"{{ goExpiring }}\" style=\"cursor:pointer;padding:6px 0\">{{ expiringLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:16px\">\n<div style=\"width:1.5px;background:#2E69FF\"><\u002Fdiv>\n<div><div style=\"font:700 80px/75px Arial;letter-spacing:-0.025em;color:#000\">{{ counts.soon }}<\u002Fdiv><div style=\"font:400 15px/18px Arial;color:#666;margin-top:6px;text-wrap:pretty\">{{ headline }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;ove iv style=\"position:absolute;right:16px;bottom:16px;width:28px;height:28px;border-right:2px solid #fff;border-bottom:2px solid #fff\"><\u002Fdiv>\n{{ scanLine }}\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;padding:0 20px 8px;align-items:center\">\n<div style=\"width:1.5px;background:#fff;align-self:stretch\"><\u002Fdiv>\n<div style=\"font:400 13px/16px Arial;flex:1;opacity:.7\">{{ scan.status }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:center;align-items:center;padding:8px 0 calc(env(safe-area-inset-bottom) + 32px)\">\n<input type=\"file\" accept=\"image/*\" capture=\"environment\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onPhoto }}\" style=\"display:none\">\n<sc-if value=\"{{ scan.idle }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ shutter }}\" style=\"width:72px;height:72px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-active=\"background:#2E69FF\"><div style=\"width:24px;height:24px;background:#000\"><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ scan.busy }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:72px;height:72px;background:#2E69FF;display:flex;align-items:center;justify-content:center\"><div style=\"width:24px;height:24px;background:#fff\"><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:calc(env(safe-area-inset-top) + 20px) 20px 0;display:flex;flex-direction:column;gap:4px\" data-screen-label=\"Confirm\">\n<div style=\"font:700 11px/14px Arial;color:#2E69FF;text-transform:uppercase\">Two photos captured<\u002Fdiv>\n<div style=\"font:700 30px/31px Arial;letter-spacing:-0.025em\">Confirm item<\u002Fdiv>\n<div style=\"font:400 13px/16px Arial;color:#666;margin-top:6px;text-wrap:pretty\">{{ draft.readNote }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:auto;padding:24px 20px 0;display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;gap:8px\">\n<div style=\"width:72px;height:96px;background:#D9D9D9;overflow:hidden\"><sc-if value=\"{{ draft.hasPhoto1 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:100%;height:100%;background-size:cover;background-position:center;background-image:{{ draft.photo1Bg }}\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n<div style=\"width:72px;height:96px;background:#D9D9D9;overflow:hidden\"><sc-if value=\"{{ draft.hasPhoto2 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:100%;height:100%;background-size:cover;background-position:center;background-image:{{ draft.photo2Bg }}\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px\">\n<div style=\"width:1.5px;background:#000\"><\u002Fdiv>\n<div style=\"flex:1\"><label style=\"font:400 12px/15px Arial;color:#666\">Product<\u002Flabel><input value=\"{{ draft.name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"e.g. Oat milk, 1 L\" style=\"display:block;width:100%;box-sizing:border-box;font:700 20px/22px Arial;letter-spacing:-0.025em;margin-top:4px;padding:8px 0;border:0;border-bottom:1.5px solid #000;border-radius:0;background:#fff;color:#000;outline:none\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px\">\n<div style=\"width:1.5px;background:#000\"><\u002Fdiv>\n<div style=\"flex:1\"><label style=\"font:400 12px/15px Arial;color:#666\">Best before<\u002Flabel><input type=\"date\" value=\"{{ draft.date }}\" sc-camel-on-change=\"{{ setDate }}\" style=\"display:block;width:100%;box-sizing:border-box;font:700 20px/22px Arial;letter-spacing:-0.025em;margin-top:4px;padding:8px 0;border:0;border-bottom:1.5px solid #000;border-radius:0;background:#fff;color:#000;outline:none;min-height:44px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px\">\n<div style=\"width:1.5px;background:#000\"><\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:400 12px/15px Arial;color:#666\">Category<\u002Fdiv><div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n<sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"4\">\n<sc-if value=\"{{ c.on }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ c.pick }}\" style=\"padding:12px 14px;background:#000;color:#fff;font:700 13px/16px Arial;cursor:pointer\">{{ c.label }}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ c.off }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ c.pick }}\" style=\"padding:12px 14px;background:#F2F2F2;color:#000;font:400 13px/16px Arial;cursor:pointer\">{{ c.label }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#F2F2F2;padding:16px;display:flex;gap:12px\">\n<div style=\"width:1.5px;background:#2E69FF\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<div style=\"font:700 11px/14px Arial;color:#2E69FF;text-transform:uppercase\">Alerts scheduled<\u002Fdiv>\n<div style=\"font:400 15px/18px Arial\"><b>{{ draft.warnLabel }}<\u002Fb> — {{ leadDays }} days before<\u002Fdiv>\n<div style=\"font:400 15px/18px Arial\"><b>{{ draft.dateLong }}<\u002Fb> — expiry day<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:8px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:16px 20px calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:8px;flex:none\">\n<div sc-camel-on-click=\"{{ retake }}\" style=\"flex:1;padding:16px;background:#fff;color:#000;border:1.5px solid #000;font:700 15px/18px Arial;text-align:center;cursor:pointer\" style-active=\"background:#F2F2F2\">Retake<\u002Fdiv>\n<sc-if value=\"{{ draft.valid }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-on-click=\"{{ save }}\" style=\"flex:2;padding:16px;background:#000;color:#fff;font:700 15px/18px Arial;text-align:center;cursor:pointer\" style-active=\"background:#2E69FF\">Save to stock<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ draft.invalid }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"flex:2;padding:16px;background:#CCCCCC;color:#fff;font:700 15px/18px Arial;text-align:center\">Save to stock<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:calc(env(safe-area-inset-top) + 12px) 20px 0;display:flex;flex-direction:column;gap:4px\" data-screen-label=\"Detail\">\n<div sc-camel-on-click=\"{{ back }}\" style=\"font:400 15px/18px Arial;color:#2E69FF;cursor:pointer;padding:8px 0;margin-bottom:4px\" style-hover=\"color:#000\">← Stock<\u002Fdiv>\n<div style=\"font:700 11px/14px Arial;color:#2E69FF;text-transform:uppercase\">{{ sel.cat }}<\u002Fdiv>\n<div style=\"font:700 30px/31px Arial;letter-spacing:-0.025em;text-wrap:pretty\">{{ sel.name }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:auto;padding:28px 20px 0;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;gap:16px\">\n<div style=\"width:1.5px;background:#000\"><\u002Fdiv>\n<div><div style=\"font:700 80px/75px Arial;letter-spacing:-0.025em\">{{ sel.daysNum }}<\u002Fdiv><div style=\"font:400 15px/18px Arial;color:#666;margin-top:6px\">{{ sel.daysUnit }} · best before {{ sel.dateLong }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px\">\n<div style=\"width:1.5px;background:#2E69FF\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:700 11px/14px Arial;color:#2E69FF;text-transform:uppercase\">Alerts<\u002Fdiv>\n<div style=\"font:400 15px/18px Arial\"><b>{{ sel.warnDate }}<\u002Fb> · {{ leadDays }} days before — {{ sel.warnState }}<\u002Fdiv>\n<div style=\"font:400 15px/18px Arial\"><b>{{ sel.dateLong }}<\u002Fb> · expiry day — {{ sel.dayState }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px\">\n<div style=\"width:1.5px;background:#CCCCCC\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:700 11px/14px Arial;color:#666;text-transform:uppercase\">Captured<\u002Fdiv>\n<div style=\"font:400 15px/18px Arial;color:#666\">Added {{ sel.added }}<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<div style=\"width:72px;height:96px;background:#D9D9D9;overflow:hidden\"><sc-if value=\"{{ sel.hasPhoto1 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:100%;height:100%;background-size:cover;background-position:center;background-image:{{ sel.photo1Bg }}\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n<div style=\"width:72px;height:96px;background:#D9D9D9;overflow:hidden\"><sc-if value=\"{{ sel.hasPhoto2 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:100%;height:100%;background-size:cover;background-position:center;background-image:{{ sel.photo2Bg }}\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:16px 20px calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:8px;flex:none\">\n<div sc-camel-on-click=\"{{ remove }}\" style=\"flex:1;padding:16px;background:#fff;color:#000;border:1.5px solid #000;font:700 15px/18px Arial;text-align:center;cursor:pointer\" style-active=\"background:#F2F2F2\">Discard<\u002Fdiv>\n<div sc-camel-on-click=\"{{ remove }}\" style=\"flex:2;padding:16px;background:#000;color:#fff;font:700 15px/18px Arial;text-align:center;cursor:pointer\" style-active=\"background:#2E69FF\">Mark as used<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;leadDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:1,&quot;max&quot;:30,&quot;unit&quot;:&quot;days&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Warnings&quot;}}\">\nconst KEY = 'pantry-expiry-items-v1';\nconst MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst CATS = ['Dairy', 'Chilled', 'Dry goods', 'Drinks', 'Other'];\nconst today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };\nconst iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\nconst parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };\nconst fmt = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;\nconst fmtLong = d => `${d.getDate()} ${MONTHS_LONG[d.getMonth()]}`;\nconst addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);\nconst seed = () => { const t = today(); return [\n  { id: 1, name: 'Oat milk, Oatly Barista', cat: 'Dairy', date: iso(addDays(t, 3)), added: iso(addDays(t, -2)) },\n  { id: 2, name: 'Greek yoghurt, 500 g', cat: 'Dairy', date: iso(addDays(t, 5)), added: iso(addDays(t, -2)) },\n  { id: 3, name: 'Cheddar, mature', cat: 'Chilled', date: iso(addDays(t, 17)), added: iso(addDays(t, -10)) },\n  { id: 4, name: 'Almonds, roasted', cat: 'Dry goods', date: iso(addDays(t, 71)), added: iso(addDays(t, -23)) },\n]; };\nconst bg = u => u ? `url(\"${u}\")` : 'none';\nconst CAT_MAP = [['dairies', 'Dairy'], ['milks', 'Dairy'], ['cheeses', 'Dairy'], ['yogurts', 'Dairy'], ['beverages', 'Drinks'], ['waters', 'Drinks'], ['juices', 'Drinks'], ['coffees', 'Dry goods'], ['teas', 'Dry goods'], ['snacks', 'Dry goods'], ['cereals', 'Dry goods'], ['nuts', 'Dry goods'], ['biscuits', 'Dry goods'], ['spreads', 'Chilled'], ['meats', 'Chilled'], ['fresh', 'Chilled'], ['salads', 'Chilled']];\nconst MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11 };\nconst loadImg = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });\nasync function readBarcode(url) {\n  const img = await loadImg(url);\n  if (window.BarcodeDetector) {\n    try { const r = await new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] }).detect(img); if (r[0]) return r[0].rawValue; } catch (e) {}\n  }\n  if (window.ZXing) {\n    try { const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true); const r = await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageElement(img); return r.getText(); } catch (e) {}\n  }\n  return null;\n}\nasync function lookupProduct(code) {\n  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity,categories_tags`);\n  const j = await r.json();\n  if (j.status !== 1 || !j.product) return null;\n  const p = j.product;\n  const name = [p.product_name, p.brands ? p.brands.split(',')[0].trim() : '', p.quantity].filter(Boolean).join(', ');\n  const tags = (p.categories_tags || []).join(' ');\n  const hit = CAT_MAP.find(([k]) => tags.includes(k));\n  return { name, cat: hit ? hit[1] : 'Other' };\n}\nfunction parseDate(text) {\n  const t = text.replace(/[|]/g, '1');\n  const now = today(); const out = [];\n  const push = (y, m, d) => { if (y < 100) y += 2000; const dt = new Date(y, m, d); if (dt.getMonth() === m && dt >= addDays(now, -1) && dt <= addDays(now, 3660)) out.push(dt); };\n  let m;\n  const re1 = /(\\d{1,2})[\\s.\\/-]+(\\d{1,2})[\\s.\\/-]+(\\d{2,4})/g;\n  while ((m = re1.exec(t))) { push(+m[3], +m[2] - 1, +m[1]); push(+m[3], +m[1] - 1, +m[2]); }\n  const re2 = /(\\d{4})[\\s.\\/-](\\d{1,2})[\\s.\\/-](\\d{1,2})/g;\n  while ((m = re2.exec(t))) push(+m[1], +m[2] - 1, +m[3]);\n  const re3 = /(\\d{1,2})[\\s.\\/-]*([A-Za-z]{3,4})[\\s.\\/-]*(\\d{2,4})/g;\n  while ((m = re3.exec(t))) { const mo = MON[m[2].toLowerCase()]; if (mo !== undefined) push(+m[3], mo, +m[1]); }\n  const re4 = /([A-Za-z]{3,4})[\\s.\\/-]*(\\d{2,4})/g;\n  while ((m = re4.exec(t))) { const mo = MON[m[1].toLowerCase()]; if (mo !== undefined && !/\\d/.test(t[m.index - 1] || '')) { const y = +m[2] < 100 ? 2000 + +m[2] : +m[2]; push(y, mo + 1, 0); } }\n  out.sort((a, b) => a - b);\n  return out[0] || null;\n}\nasync function readDate(url) {\n  if (!window.Tesseract) return null;\n  const { data } = await Tesseract.recognize(url, 'eng', { tessedit_char_whitelist: '0123456789/.-: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz' });\n  return parseDate(data.text || '');\n}\nconst load = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && Array.isArray(v.items)) return v; } catch (e) {} return null; };\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const saved = load();\n    this.state = { items: saved ? saved.items : seed(), nextId: saved ? saved.nextId : 5, screen: 'home', step: 1, sel: null, busy: false, status: '', draft: this.blankDraft() };\n    this.fileRef = React.createRef();\n    this.importRef = React.createRef();\n    this.state.backupNote = 'Saves a small file of your items you can keep, email, or import on another phone.';\n    this.photos = {};\n  }\n  blankDraft() { return { name: '', cat: 'Dairy', date: iso(addDays(today(), 7)), photo1: null, photo2: null, code: null, productRead: false, dateRead: false }; }\n  async processProduct(url) {\n    this.setState({ busy: true, status: 'Reading barcode…' });\n    let code = null, prod = null;\n    try { code = await readBarcode(url); } catch (e) {}\n    if (code) { this.setState({ status: `Barcode ${code} — looking up product…` }); try { prod = await lookupProduct(code); } catch (e) {} }\n    this.setState(s => ({ busy: false, step: 2, status: prod ? `Found: ${prod.name}` : code ? `Barcode ${code} not in Open Food Facts — enter name on the next step` : 'No barcode read — enter the name on the next step', draft: { ...s.draft, photo1: url, code, productRead: !!prod, name: prod ? prod.name : s.draft.name, cat: prod ? prod.cat : s.draft.cat } }));\n  }\n  async processDate(url) {\n    this.setState({ busy: true, status: 'Reading date label…' });\n    let d = null;\n    try { d = await readDate(url); } catch (e) {}\n    this.setState(s => ({ busy: false, screen: 'confirm', status: '', draft: { ...s.draft, photo2: url, dateRead: !!d, date: d ? iso(d) : s.draft.date } }));\n  }\n  async exportData() {\n    const payload = JSON.stringify({ app: 'pantry-expiry', exported: iso(today()), items: this.state.items }, null, 2);\n    const name = `pantry-backup-${iso(today())}.json`;\n    const file = new File([payload], name, { type: 'application/json' });\n    if (navigator.canShare && navigator.canShare({ files: [file] })) {\n      try { await navigator.share({ files: [file], title: 'Pantry backup' }); this.setState({ backupNote: `Shared ${this.state.items.length} items.` }); return; } catch (e) { if (e.name === 'AbortError') return; }\n    }\n    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();\n    this.setState({ backupNote: `Exported ${this.state.items.length} items to ${name}.` });\n  }\n  onImport(e) {\n    const f = e.target.files && e.target.files[0]; e.target.value = '';\n    if (!f) return;\n    const r = new FileReader();\n    r.onload = () => {\n      try {\n        const j = JSON.parse(r.result);\n        const incoming = Array.isArray(j) ? j : j.items;\n        if (!Array.isArray(incoming)) throw new Error('bad');\n        this.setState(s => {\n          const key = it => `${(it.name || '').toLowerCase()}|${it.date}`;\n          const have = new Set(s.items.map(key));\n          let id = s.nextId; const added = [];\n          for (const it of incoming) {\n            if (!it || !it.name || !/^\\d{4}-\\d{2}-\\d{2}$/.test(it.date || '') || have.has(key(it))) continue;\n            added.push({ id: id++, name: String(it.name), cat: CATS.includes(it.cat) ? it.cat : 'Other', date: it.date, added: /^\\d{4}-\\d{2}-\\d{2}$/.test(it.added || '') ? it.added : iso(today()) });\n            have.add(key(it));\n          }\n          return { items: [...s.items, ...added], nextId: id, backupNote: added.length ? `Imported ${added.length} new item${added.length === 1 ? '' : 's'}${incoming.length - added.length ? `, skipped ${incoming.length - added.length} already in stock` : ''}.` : 'Nothing new to import — all items already in stock.' };\n        });\n      } catch (err) { this.setState({ backupNote: 'That file is not a Pantry backup.' }); }\n    };\n    r.readAsText(f);\n  }\n  persist() { try { localStorage.setItem(KEY, JSON.stringify({ items: this.state.items, nextId: this.state.nextId })); } catch (e) {} }\n  componentDidUpdate(_, prev) { if (prev.items !== this.state.items) this.persist(); }\n  setDraft(patch) { this.setState(s => ({ draft: { ...s.draft, ...patch } })); }\n  decorate(it, i, lead) {\n    const t = today(); const date = parse(it.date);\n    const d = Math.round((date - t) / 86400000);\n    const urgent = d <= lead;\n    return {\n      ...it, urgent, calm: !urgent, band: i % 2 ? '#F2F2F2' : '#fff',\n      dateLabel: fmt(date), dateLong: fmtLong(date),\n      daysNum: d <= 0 ? 0 : d, daysUnit: d < 0 ? 'expired' : d === 0 ? 'expires today' : d === 1 ? 'day left' : 'days left',\n      daysLabel: d < 0 ? 'Expired' : d === 0 ? 'Today' : d === 1 ? '1 day' : `${d} days`,\n      daysLabelLower: d < 0 ? 'already expired' : d === 0 ? 'today' : d === 1 ? 'in 1 day' : `in ${d} days`,\n      warnDate: fmt(addDays(date, -lead)), warnState: d <= lead ? 'sent' : 'scheduled', dayState: d <= 0 ? 'sent' : 'scheduled',\n      added: fmt(parse(it.added)),\n      photo1Bg: bg(this.photos[it.id + ':1']), hasPhoto1: !!this.photos[it.id + ':1'], photo2Bg: bg(this.photos[it.id + ':2']), hasPhoto2: !!this.photos[it.id + ':2'],\n      open: () => this.setState({ screen: 'detail', sel: it.id }),\n    };\n  }\n  renderVals() {\n    const { screen, step, draft, busy, status } = this.state;\n    const lead = this.props.leadDays ?? 7;\n    const sorted = [...this.state.items].sort((x, y) => x.date < y.date ? -1 : 1);\n    const items = sorted.map((it, i) => this.decorate(it, i, lead));\n    const expiring = items.filter(it => it.urgent).map((it, i) => ({ ...it, band: i % 2 ? '#F2F2F2' : '#fff' }));\n    const selRaw = this.state.items.find(it => it.id === this.state.sel);\n    const sel = selRaw ? this.decorate(selRaw, 0, lead) : {};\n    const next = expiring[0];\n    const headline = expiring.length ? `items expire within ${lead} days. Next: ${next.name}, ${next.daysLabelLower}.` : `items expire within ${lead} days. ${items.length} tracked.`;\n    const isScan = screen === 'scan';\n    const scan = step === 1\n      ? { stepNum: 1, title: 'Barcode', hint: 'Photograph the barcode on the pack. The product is looked up in Open Food Facts.', status: status || 'Tap the shutter to open the camera', previewBg: bg(draft.photo1), hasPreview: !!draft.photo1, noPreview: !draft.photo1 }\n      : { stepNum: 2, title: 'Expiry date', hint: 'Now the best-before print — usually on the lid, base, or seam. Fill the frame with the date.', status: status || 'Tap the shutter for the date label', previewBg: bg(draft.photo2), hasPreview: !!draft.photo2, noPreview: !draft.photo2 };\n    scan.busy = busy; scan.idle = !busy;\n    const readNote = [draft.productRead ? `Product read from barcode ${draft.code}` : 'Product not recognised — type the name', draft.dateRead ? 'date read from label' : 'date not read — set it below'].join(' · ') + '. Check both before saving.';\n    const scanLine = isScan ? React.createElement('div', { key: 'sl', style: { position: 'absolute', left: 16, right: 16, height: 1.5, background: '#2E69FF', animation: 'scanline 2.2s cubic-bezier(0.2,0,0,1) infinite alternate' } }) : null;\n    const dDate = /^\\d{4}-\\d{2}-\\d{2}$/.test(draft.date) ? parse(draft.date) : null;\n    const valid = draft.name.trim().length > 0 && !!dDate;\n    return {\n      leadDays: lead, todayLabel: fmt(today()),\n      items, expiring, sel, headline,\n      counts: { total: items.length, soon: expiring.length },\n      isEmpty: items.length === 0, noneExpiring: expiring.length === 0,\n      isList: screen === 'home' || screen === 'expiring', isHome: screen === 'home', isExpiring: screen === 'expiring',\n      isScan, isConfirm: screen === 'confirm', isDetail: screen === 'detail',\n      homeLabel: screen === 'home' ? '● All stock' : 'All stock', expiringLabel: screen === 'expiring' ? '● Expiring' : 'Expiring',\n      scan, scanLine, fileRef: this.fileRef,\n      draft: { ...draft, valid, invalid: !valid, readNote, hasPhoto1: !!draft.photo1, hasPhoto2: !!draft.photo2, photo1Bg: bg(draft.photo1), photo2Bg: bg(draft.photo2), warnLabel: dDate ? fmtLong(addDays(dDate, -lead)) : '—', dateLong: dDate ? fmtLong(dDate) : '—' },\n      cats: CATS.map(c => ({ label: c, on: draft.cat === c, off: draft.cat !== c, pick: () => this.setDraft({ cat: c }) })),\n      backupNote: this.state.backupNote, importRef: this.importRef,\n      exportData: () => this.exportData(),\n      importClick: () => { if (this.importRef.current) this.importRef.current.click(); },\n      onImport: e => this.onImport(e),\n      goHome: () => this.setState({ screen: 'home' }),\n      goExpiring: () => this.setState({ screen: 'expiring' }),\n      goScan: () => this.setState({ screen: 'scan', step: 1, busy: false, status: '', draft: this.blankDraft() }),\n      cancel: () => this.setState({ screen: 'home', step: 1, busy: false, status: '' }),\n      shutter: () => { if (!this.state.busy && this.fileRef.current) this.fileRef.current.click(); },\n      onPhoto: e => {\n        const f = e.target.files && e.target.files[0]; e.target.value = '';\n        if (!f) return;\n        const url = URL.createObjectURL(f);\n        if (this.state.step === 1) this.processProduct(url); else this.processDate(url);\n      },\n      retake: () => this.setState({ screen: 'scan', step: 1, busy: false, status: '', draft: this.blankDraft() }),\n      setName: e => this.setDraft({ name: e.target.value }),\n      setDate: e => this.setDraft({ date: e.target.value }),\n      save: () => this.setState(s => {\n        const id = s.nextId;\n        this.photos[id + ':1'] = s.draft.photo1; this.photos[id + ':2'] = s.draft.photo2;\n        return { items: [...s.items, { id, name: s.draft.name.trim(), cat: s.draft.cat, date: s.draft.date, added: iso(today()) }], nextId: id + 1, screen: 'detail', step: 1, sel: id };\n      }),\n      back: () => this.setState({ screen: 'home', sel: null }),\n      remove: () => this.setState(s => ({ items: s.items.filter(it => it.id !== s.sel), screen: 'home', sel: null })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
